global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Kafka metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Scrape Postgres metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']