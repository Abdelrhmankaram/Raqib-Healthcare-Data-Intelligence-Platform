version: 2

models:
  - name: stg_emergency_contacts

    columns:
      - name: patient_id
        data_tests:
          - not_null

      - name: emergency_contact_bloodtype
        data_tests:
          - accepted_values:
              arguments:
                values: ["A+", "AB+", "B+", "O+", "O-", "AB-", "A-", "B-"]

      - name: emergency_contact_phone_number
        data_tests:
          - not_null

      - name: is_valid_phone_number
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: stg_providers

    columns:
      - name: npi
        data_tests:
          - unique
          - not_null

      - name: provider_first_name
        data_tests:
          - not_null

      - name: provider_last_name
        data_tests:
          - not_null

      - name: is_valid_enumeration_date
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_valid_join_date
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]

      - name: provider_sex
        data_tests:
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'Unknown']

  - name: stg_diagnosis

    columns:
      - name: diagnosis_id
        data_tests:
          - unique
          - not_null

      - name: patient_id
        data_tests:
          - not_null

      - name: sub_domain_key
        data_tests:
          - not_null

      - name: sub_domain_1
        data_tests:
          - not_null 
    
  - name: stg_lab_specimen_types

    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null

  - name: stg_lab_events

    columns:
      - name: lab_event_id
        data_tests:
          - unique
          - not_null

      - name: patient_id
        data_tests:
          - not_null
      
      - name: specimen_id
        data_tests:
          - not_null
      
      - name: item_id
        data_tests:
          - not_null

      - name: result_value
        data_tests:
          - not_null

      - name: abnormal_flag
        data_tests:
          - accepted_values:
              arguments:
                values: ['High', 'Low', 'Normal']

  - name: stg_services
    columns:
      - name: patient_id
        data_tests:
          - not_null
      
      - name: service_id
        data_tests:
          - not_null

  - name: stg_transfers
    columns: 
      - name: transfer_id
        data_tests:
          - not_null
          - unique
      
      - name: patient_id
        data_tests:
          - not_null
      
      - name: from_department
        data_tests:
          - not_null
      
      - name: to_department
        data_tests:
          - not_null

      