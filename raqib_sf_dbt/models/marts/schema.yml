version: 2

models:

  # ============ DIMENSIONS ============

  - name: dim_patients
    description: Patient dimension table
    columns:
      - name: patient_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: patient_id
        description: Business key
        tests:
          - unique
          - not_null
      - name: full_name
        tests:
          - not_null
      - name: birthdate
        tests:
          - not_null

  - name: dim_provider
    description: Provider dimension table
    columns:
      - name: provider_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: provider_id
        description: Business key
        tests:
          - unique
          - not_null
      - name: provider_full_name
        tests:
          - not_null
      - name: provider_specialty
        tests:
          - not_null

  - name: dim_admission_type
    description: Admission type dimension table
    columns:
      - name: admission_type_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: admission_type
        tests:
          - not_null

  - name: dim_location
    description: Location dimension table
    columns:
      - name: location_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: location_name
        tests:
          - not_null

  - name: dim_date
    description: Date dimension table
    columns:
      - name: date_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: date_bk
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: month
        tests:
          - not_null

  - name: dim_time
    description: Time dimension table
    columns:
      - name: time_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: time_bk
        tests:
          - unique
          - not_null
      - name: hour
        tests:
          - not_null

  - name: dim_diagnosis
    description: Diagnosis dimension table
    columns:
      - name: diagnosis_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: diagnosis_id
        description: Business key
        tests:
          - unique
          - not_null
      - name: description
        tests:
          - not_null
      - name: domain
        tests:
          - not_null

  - name: dim_lab_types
    description: Lab specimen types dimension table
    columns:
      - name: specimen_type_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: item_id
        description: Business key
        tests:
          - unique
          - not_null
      - name: label
        tests:
          - not_null

  - name: dim_services
    description: Services dimension table
    columns:
      - name: service_dim_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: service_name
        tests:
          - not_null

  - name: dim_emergency_contacts
    description: Emergency contacts dimension table
    columns:
      - name: contact_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: emergency_contact_name
        tests:
          - not_null
      - name: emergency_contact_phone_number
        tests:
          - not_null

  # ============ FACTS ============

  - name: fact_encounters
    description: Core encounter fact table
    columns:
      - name: encounter_key
        tests:
          - unique
          - not_null
      - name: admission_id
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: provider_id
        tests:
          - not_null
      - name: length_of_stay_days
        tests:
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: discharge_status
        tests:
          - not_null
          - accepted_values:
              values: ['Deceased', 'Alive']
      - name: age_group
        tests:
          - accepted_values:
              values: ['Child', 'Teen', 'Adult', 'Senior']

  - name: fact_clinical_events
    description: Unified clinical events fact table
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
      - name: admission_id
        tests:
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['Diagnosis', 'Lab', 'Medication']
      - name: event_cost
        tests:
          - not_null

  - name: fact_lab_results
    description: Detailed lab results fact table
    columns:
      - name: lab_event_key
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: admission_id
        tests:
          - not_null
      - name: lab_done_at
        tests:
          - not_null
      - name: abnormal_flag
        tests:
          - accepted_values:
              values: ['High', 'Low', 'Normal']

  - name: fact_providers_performance
    description: Provider performance fact table
    columns:
      - name: provider_performance_key
        tests:
          - unique
          - not_null
      - name: provider_id
        tests:
          - unique
          - not_null
      - name: total_encounters
        tests:
          - not_null
      - name: mortality_rate
        tests:
          - not_null

  - name: fact_patient_finances
    description: Patient financial fact table
    columns:
      - name: patient_key
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: healthcare_expenses
        tests:
          - not_null
      - name: total_admissions_cost
        tests:
          - not_null

  - name: fact_patient_services
    description: Patient services fact table
    columns:
      - name: service_key
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: admission_id
        tests:
          - not_null
      - name: cost
        tests:
          - not_null

  - name: fact_transfers
    description: Patient transfers fact table
    columns:
      - name: transfer_key
        tests:
          - unique
          - not_null
      - name: transfer_id
        tests:
          - not_null
      - name: patient_id
        tests:
          - not_null
      - name: from_department
        tests:
          - not_null
      - name: to_department
        tests:
          - not_null